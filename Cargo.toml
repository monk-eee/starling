[package]
rust-version = "1.99"
publish = false
name = "starling"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "MCP workload runner and live performance dashboard"

[features]
default = []
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "reqwest/blocking"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6", features = ["derive"] }
fastrand = "2"
hdrhistogram = { version = "7", default-features = false }
humantime = "2"
humantime-serde = "1"
opentelemetry = { version = "=0.33.1", default-features = false, features = ["logs", "metrics", "trace"], optional = true }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["logs", "metrics", "trace"], optional = true }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "logs", "metrics", "trace", "reqwest-blocking-client"], optional = true }
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rmcp = { version = "3.11", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
toml = "1"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
url = { version = "2", features = ["serde"] }
regex = "1"
unicode-normalization = "0.1"

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "logs", "metrics", "trace"] }
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
