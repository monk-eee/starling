[package]
rust-version = "1.97"
publish = false
name = "starling"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local MCP workload runner and live performance dashboard"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6", features = ["derive"] }
fastrand = "2"
hdrhistogram = { version = "7", default-features = false }
humantime = "2"
humantime-serde = "1"
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "3.11", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "1"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
