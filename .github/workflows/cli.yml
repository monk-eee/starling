name: CLI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and install the CLI
        run: |
          npm --prefix web ci
          npm --prefix web run build
          cargo install --path . --locked --root "$RUNNER_TEMP/cli"
      - name: Try it outside the checkout
        run: |
          export PATH="$RUNNER_TEMP/cli/bin:$PATH"
          cd "$(mktemp -d)"
          starling init
          starling validate
          starling demo --duration 1s --report result
          test -s result/index.html
      - name: Verify the native CLI, scenarios and shutdown
        run: cargo test --locked --release --workspace --all-features

  linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test the isolated CLI
        run: |
          docker build -t starling-ci .
          docker run --rm --network none --entrypoint sh starling-ci -ec '
            starling init
            starling validate
            starling demo --duration 1s --report result
            test -s result/index.html
          '
      - name: Stop the container and verify its saved report
        run: |
          reports="$(mktemp -d)"
          cid="$(docker run -d --network none --user "$(id -u):$(id -g)" \
            -v "$reports:/work/out" starling-ci demo --duration 1m --report out/stopped)"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for _ in {1..100}; do
            test -d "$reports/stopped" && break
            sleep 0.1
          done
          test -d "$reports/stopped"
          docker stop --timeout 15 "$cid"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$cid")" = 0
          jq -e '.status == "stopped" and .in_flight == 0 and .sessions == 0' "$reports/stopped/summary.json"
          test -s "$reports/stopped/index.html"
      - name: Verify independent birds over mutual TLS
        run: |
          docker pull node:22-bookworm-slim
          python3 tests/flock_containers.py starling-ci node:22-bookworm-slim
