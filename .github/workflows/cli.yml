name: CLI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [rust, dashboard]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix web ci
      - name: Prepare Rust coverage
        if: matrix.suite == 'rust'
        run: |
          python3 -B tests/test_coverage.py
          npm --prefix web run build
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Install Chromium
        if: matrix.suite == 'dashboard'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - run: python3 tests/coverage.py ${{ matrix.suite }}
      - name: Show per-file coverage
        if: ${{ !cancelled() && hashFiles(format('target/coverage/{0}/summary.md', matrix.suite)) != '' }}
        run: cat target/coverage/${{ matrix.suite }}/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.suite }}
          path: target/coverage/${{ matrix.suite }}
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install the CLI
        run: |
          npm --prefix web ci
          npm --prefix web run build
          cargo install --path . --locked --root "$RUNNER_TEMP/cli"
      - name: Try it outside the checkout
        run: |
          export PATH="$RUNNER_TEMP/cli/bin:$PATH"
          cd "$(mktemp -d)"
          starling init
          starling validate
          starling demo --duration 1s --report first-run 2>events.log || { cat events.log >&2; exit 1; }
          test -s first-run/index.html
          jq -se --slurpfile report first-run/summary.json '
            map(select(.event == "run_finished")) |
            length == 1 and .[0].status == "completed" and
            .[0].requests > 0 and .[0].requests == $report[0].calls.count and .[0].failed == 0
          ' events.log
      - name: Check the installed version and deployment gates
        id: gates
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.ref_name || '' }}
        run: python3 tests/release_smoke.py "$RUNNER_TEMP/cli/bin/starling" "$RUNNER_TEMP/deployment-gates" --tag "$RELEASE_TAG"
      - name: Save synthetic deployment reports even when a gate fails
        if: ${{ !cancelled() && steps.gates.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-gates
          path: |
            ${{ runner.temp }}/deployment-gates/*/conformance.json
            ${{ runner.temp }}/deployment-gates/*/index.html
            ${{ runner.temp }}/deployment-gates/*/run.json
            ${{ runner.temp }}/deployment-gates/*/summary.json
            ${{ runner.temp }}/deployment-gates/*/timeseries.json
            ${{ runner.temp }}/deployment-gates/*/operations.csv
            ${{ runner.temp }}/deployment-gates/*/errors.csv
            ${{ runner.temp }}/deployment-gates/*/junit.xml
          if-no-files-found: error
      - name: Verify the native CLI, scenarios and shutdown
        run: cargo test --locked --release --workspace --all-features

  linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test the isolated CLI
        run: |
          docker build --build-arg STARLING_FEATURES=otlp -t starling-ci .
          docker run --rm --network none --entrypoint sh starling-ci -ec '
            starling init
            starling validate
            starling demo --duration 1s --report result
            test -s result/index.html
          '
      - name: Stop the container and verify its saved report
        run: |
          reports="$(mktemp -d)"
          cid="$(docker run -d --network none --user "$(id -u):$(id -g)" \
            -v "$reports:/work/out" starling-ci demo --duration 1m --report out/stopped)"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for _ in {1..100}; do
            test -d "$reports/stopped" && break
            sleep 0.1
          done
          test -d "$reports/stopped"
          docker stop --timeout 15 "$cid"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$cid")" = 0
          jq -e '.status == "stopped" and .in_flight == 0 and .sessions == 0' "$reports/stopped/summary.json"
          test -s "$reports/stopped/index.html"
      - name: Verify flock mTLS and HTTP/HTTPS MCP targets
        run: |
          docker pull node:22-bookworm-slim
          python3 tests/flock_containers.py starling-ci node:22-bookworm-slim
